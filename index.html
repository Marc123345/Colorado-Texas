   stamped "API KEY REQUIRED". OSM swaps in if Esri ever errors the same way. */
const base = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{
  attribution:'Tiles &copy; <a href="https://www.esri.com">Esri</a> &mdash; Esri, DeLorme, NAVTEQ',
  maxZoom:16
}).addTo(map);

let swapped = false;
base.on('tileerror', () => {
  if(swapped) return;
  swapped = true;
  map.removeLayer(base);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom:19
  }).addTo(map);
});

/* Groups are built once and added/removed when the region changes. */
const groups = {};
Object.keys(ZONES).forEach(k => groups[k] = L.layerGroup());

function popupHTML(c){
  const z = ZONES[c.z];
  return `<div class="pp">
    <h3>${c.star ? "⭐ " : ""}${c.n}</h3>
    <span class="tag" style="background:${z.color}">${z.name}</span>${c.ads ? '<span class="tag ads">Ads live</span>' : ''}
    <p>${c.b}</p>
    ${c.d ? `<div class="dist">🚗 ${c.d}</div>` : ''}
  </div>`;
}

function addCity(c){
  const z = ZONES[c.z];
  const r = c.star ? 9 : 6;
  const m = L.circleMarker(c.ll,{
    radius:r, color:"#0d1420", weight:1.5, fillColor:z.color, fillOpacity:.95
  }).bindPopup(popupHTML(c));
  m.bindTooltip(c.n,{permanent:true,direction:'right',offset:[8,0],className:'city-label'});
  m.addTo(groups[c.z]);
  c.marker = m;
}
CITIES.forEach(addCity);

/* semiconductor plant markers */
PLANTS.forEach(p=>{
  const m = L.marker(p.ll,{
    icon: L.divIcon({className:'', html:'<div style="font-size:20px;filter:drop-shadow(0 1px 3px #000)">🏭</div>', iconSize:[22,22], iconAnchor:[11,11]})
  }).bindPopup(`<div class="pp"><h3>🏭 ${p.n}</h3><span class="tag" style="background:${ZONES.core.color}">Semiconductor build-out</span><p>${p.b}</p><div class="dist">🚗 ${p.d}</div></div>`);
  m.addTo(groups.core);
});

function zoneCircle(ll, radius, zoneKey, title, body){
  const z = ZONES[zoneKey];
  L.circle(ll,{radius, color:z.color, weight:1.5, dashArray:"4 6", fillColor:z.color, fillOpacity:.06})
   .bindPopup(`<div class="pp"><h3>${title}</h3><span class="tag" style="background:${z.color}">${z.name}</span><p>${body}</p></div>`)
   .addTo(groups[zoneKey]);
}

/* -------- colorado shapes -------- */

/* The ad footprint: Fort Collins/Greeley down I-25 to Pueblo. */
L.polyline([[40.5853,-105.0844],[40.3978,-105.0750],[40.1672,-105.1019],[39.9205,-105.0867],[39.7392,-104.9903],[39.3722,-104.8561],[38.8339,-104.8214],[38.2544,-104.6091]],
  {color:"#2f80ed",weight:3,opacity:.55,dashArray:"10 8"})
 .bindPopup(`<div class="pp"><h3>I-25 Front Range corridor</h3><span class="tag" style="background:#2f80ed">Ad footprint</span><p>Fort Collins to Pueblo — one tight 2-hour corridor holding nearly all of Colorado’s commercial roofs. Ads run on Denver metro, the Springs, Fort Collins, Greeley and Pueblo only.</p></div>`)
 .addTo(groups.front);

zoneCircle([39.7392,-104.9903], 40000, "front", "Denver metro", "25 mile working radius — Denver, Aurora, Commerce City, Westminster/Thornton, Broomfield and Boulder.");
zoneCircle([38.8339,-104.8214], 30000, "front", "Colorado Springs", "Military installations, warehouse belt, same hail exposure as Denver.");
zoneCircle([38.2544,-104.6091], 22000, "front", "Pueblo", "Industrial south anchor.");
zoneCircle([40.5000,-104.9000], 30000, "north", "Fort Collins / Greeley", "North anchor pair inside the ad footprint.");
zoneCircle([39.0639,-108.5506], 35000, "slope", "Grand Junction", "Its own small spend later, only if he wants the Slope.");

/* -------- texas shapes -------- */

/* main corridor band: 50 mi east & west of US-75, Sherman/Denison center line */
L.polygon([
  [33.92,-97.90],[33.92,-95.50],[33.20,-95.50],[33.20,-97.90]
],{
  color:"#2f80ed", weight:2, dashArray:"6 6", fillColor:"#2f80ed", fillOpacity:.06
}).bindPopup(`<div class="pp"><h3>Primary Territory Band</h3><span class="tag" style="background:#2f80ed">≈100 mi wide</span><p>US-75 corridor with Sherman/Denison as the center line, extending east to Paris and west to Bowie. He lives on its western edge. Radius adjustable once live lead data shows where the best jobs come from.</p></div>`)
 .addTo(groups.core);

/* east texas pocket circle */
L.circle([33.08,-95.25],{radius:60000, color:"#9b59b6", weight:2, dashArray:"6 6", fillColor:"#9b59b6", fillOpacity:.07})
 .bindPopup(`<div class="pp"><h3>East Texas Pocket</h3><span class="tag" style="background:#9b59b6">Add-on zone</span><p>Poultry, dairy and food-processing belt — big flat & metal roofs, almost no ad competition targeting it.</p></div>`)
 .addTo(groups.pocket);

/* west texas metro circles; Midland/Odessa share one */
[[33.914,-98.493,"Wichita Falls"],[32.449,-99.733,"Abilene"],[31.464,-100.437,"San Angelo"],[31.92,-102.22,"Midland / Odessa"]].forEach(([la,lo,nm])=>{
  L.circle([la,lo],{radius:55000,color:"#e74c3c",weight:1.5,dashArray:"4 6",fillColor:"#e74c3c",fillOpacity:.05})
   .bindPopup(`<div class="pp"><h3>${nm}</h3><span class="tag" style="background:#e74c3c">Expansion market</span><p>Hail belt + high UV — steady commercial coating demand.</p></div>`)
   .addTo(groups.wtx);
});

/* Oklahoma is drawn as routes and radii, not a band: the southern edge is the
   Red River, which wanders, and a straight-line band would put half of
   Grayson County, TX inside an Oklahoma zone. */

/* US-75/69 north: Denison -> Colbert -> Durant -> Atoka -> McAlester */
L.polyline([[33.755,-96.537],[33.857,-96.505],[33.994,-96.371],[34.386,-96.128],[34.933,-95.770]],
  {color:"#f5a623",weight:3,opacity:.55,dashArray:"10 8"})
 .bindPopup(`<div class="pp"><h3>US-75 / US-69 north</h3><span class="tag" style="background:#f5a623">Oklahoma run</span><p>Straight up the road the corridor already sits on: Durant is 50 minutes from his door, Atoka 1 hr 30, McAlester 2 hr 20 — a routed day, not an expedition.</p></div>`)
 .addTo(groups.ok);

/* US-70 / I-35 west: Durant -> Madill -> Ardmore */
L.polyline([[33.994,-96.371],[34.093,-96.771],[34.174,-97.144]],
  {color:"#f5a623",weight:3,opacity:.55,dashArray:"10 8"})
 .bindPopup(`<div class="pp"><h3>US-70 west to I-35</h3><span class="tag" style="background:#f5a623">Oklahoma run</span><p>Durant across to Ardmore via Madill, joining I-35. Ardmore is 55 minutes from his door — closer than Bonham, and a bigger industrial market.</p></div>`)
 .addTo(groups.ok);

/* Working radii on the anchors only — the smaller towns are pins on a route. */
zoneCircle([34.1743,-97.1436], 40000, "ok", "Ardmore", "25 mile working radius — indicative, and adjustable once live lead data shows where the jobs actually come from.");
zoneCircle([33.9943,-96.3711], 32000, "ok", "Durant", "20 mile working radius — indicative, and adjustable once live lead data shows where the jobs actually come from.");
zoneCircle([34.9334,-95.7697], 32000, "ok", "McAlester", "20 mile working radius — indicative, and adjustable once live lead data shows where the jobs actually come from.");

/* -------------------------------- sidebar --------------------------------- */
const counts = {};
CITIES.forEach(c => counts[c.z]=(counts[c.z]||0)+1);
counts.core += PLANTS.length;

/* Zoom frames whatever a zone actually contains, so adding or moving a pin can
   never leave its card zooming to a stale centre. */
function boundsOf(keys){
  const b = L.latLngBounds([]);
  keys.forEach(k => groups[k].eachLayer(l => {
    if (l.getBounds) b.extend(l.getBounds());
    else if (l.getLatLng) b.extend(l.getLatLng());
  }));
  return b;
}
function flyToZone(key){
  const b = boundsOf([key]);
  if (b.isValid()) map.flyToBounds(b, {padding:[40,40], duration:.9, maxZoom:10});
}

let region = null;
function showRegion(key){
  if (!REGIONS[key]) key = "co";
  region = key;
  const r = REGIONS[key];
  const keys = Object.keys(ZONES).filter(k => ZONES[k].region === key);

  Object.keys(groups).forEach(k => {
    if (keys.includes(k)) groups[k].addTo(map);
    else map.removeLayer(groups[k]);
  });

  document.getElementById('hdrTitle').innerHTML = r.title;
  document.getElementById('hdrSub').innerHTML = r.sub;
  document.getElementById('stZones').textContent = keys.length;
  document.getElementById('stMarkets').textContent = keys.reduce((s,k)=>s+(counts[k]||0),0);
  document.querySelectorAll('.tab').forEach(t => {
    const on = t.dataset.region === key;
    t.classList.toggle('on', on);
    t.setAttribute('aria-selected', on);
  });

  const cardsEl = document.getElementById('zoneCards');
  cardsEl.innerHTML = '';
  keys.forEach(k => {
    const z = ZONES[k];
    const card = document.createElement('div');
    card.className='zone-card'; card.id='card-'+k;
    card.innerHTML = `
      <div class="zone-head">
        <span class="dot" style="background:${z.color}"></span>
        <b>${z.name}</b>
        <span class="cnt">${counts[k]||0}</span>
      </div>
      <p>${z.desc}</p>
      <ul class="towns">${CITIES.filter(c => c.z === k).map(c => `
        <li data-town="${c.n}"><span class="tn">${c.star ? "⭐ " : ""}${c.n}${c.ads ? '<span class="ad">Ads</span>' : ''}</span>${c.d ? `<span class="td">${c.d}</span>` : ''}</li>`).join('')}
      </ul>
      <div class="zone-actions">
        <button class="zbtn" data-act="zoom">🔍 Zoom</button>
        <button class="zbtn" data-act="toggle">👁 Show / hide</button>
      </div>`;
    card.addEventListener('click',e=>{
      const town = e.target.closest('[data-town]');
      if(town){
        const c = CITIES.find(x => x.n === town.dataset.town);
        if(!map.hasLayer(groups[k])){ groups[k].addTo(map); card.classList.remove('off'); }
        map.flyTo(c.ll, Math.max(map.getZoom(), 10), {duration:.9});
        map.once('moveend', () => c.marker.openPopup());
        if(window.innerWidth<=820) document.getElementById('sidebar').classList.remove('open');
        return;
      }
      const btn = e.target.closest('.zbtn');
      if(btn && btn.dataset.act==='toggle'){
        e.stopPropagation();
        if(map.hasLayer(groups[k])){ map.removeLayer(groups[k]); card.classList.add('off'); }
        else { groups[k].addTo(map); card.classList.remove('off'); }
        return;
      }
      if(!map.hasLayer(groups[k])){ groups[k].addTo(map); card.classList.remove('off'); }
      flyToZone(k);
      if(window.innerWidth<=820) document.getElementById('sidebar').classList.remove('open');
    });
    cardsEl.appendChild(card);
  });

  document.getElementById('regionNotes').innerHTML = r.notes.map(n => `<div class="note">${n}</div>`).join('');
  document.getElementById('sidebar').scrollTop = 0;

  const b = boundsOf(keys);
  if (b.isValid()) map.fitBounds(b, {padding:[30,30]});
  labelVisibility();
  if (location.hash !== '#'+key) history.replaceState(null, '', '#'+key);
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => showRegion(t.dataset.region)));
window.addEventListener('hashchange', () => { if (location.hash.slice(1) !== region) showRegion(location.hash.slice(1)); });

/* hide city labels when zoomed way out to reduce clutter */
function labelVisibility(){
  const show = map.getZoom() >= (REGIONS[region] ? REGIONS[region].labelZoom : 8);
  document.querySelectorAll('.city-label').forEach(el=>{
    el.style.display = show ? '' : 'none';
  });
}
map.on('zoomend', labelVisibility);

/* mobile sidebar */
document.getElementById('mobToggle').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

showRegion(location.hash.slice(1) || "co");
</script>
</body>
</html>
